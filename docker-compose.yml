services:

    neo4j:
      image: neo4j:2026.08.1
      container_name: kubegraph-neo4j
      ports:
        - "7474:7474"
        - "7687:7687"
      environment:
        NEO4J_AUTH: neo4j/password123
      volumes:
        - neo4j_data:/data
        - neo4j_logs:/logs

    postgres:
      image: pgvector/pgvector:pg17
      container_name: kubegraph-postgres
      ports:
        - "5432:5432"
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: rag
      volumes:
        - postgres_data:/var/lib/postgresql/data

volumes:
    neo4j_data:
    neo4j_logs:
    postgres_data:
  